<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday - Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .weather-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .weather-card .location {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .weather-card .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .weather-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .info-item .label {
            color: #666;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .info-item .value {
            color: #333;
            font-size: 1.3em;
            font-weight: bold;
        }

        .temperature-large {
            font-size: 3em;
            color: #667eea;
            margin: 10px 0;
            font-weight: bold;
        }

        .weather-description {
            color: #666;
            font-size: 1.1em;
            margin: 10px 0;
            text-transform: capitalize;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .forecast-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 30px;
        }

        .forecast-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .forecast-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .forecast-item .time {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .forecast-item .weather {
            color: #333;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .forecast-item .temp {
            color: #764ba2;
            font-size: 1.3em;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2em;
            }

            .search-box {
                flex-direction: column;
            }

            input[type="text"], button {
                width: 100%;
            }

            .weather-info {
                grid-template-columns: 1fr;
            }

            .temperature-large {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ FRIDAY</h1>
            <p>Your AI-Powered Weather Assistant</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, New York)" />
                <button onclick="searchWeather()">Search Weather</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div id="weatherContainer" class="weather-grid"></div>
    </div>

    <script>
        const weatherContainer = document.getElementById('weatherContainer');
        const errorMessage = document.getElementById('errorMessage');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        function showLoading() {
            weatherContainer.innerHTML = `
                <div class="loading" style="grid-column: 1 / -1;">
                    <div class="spinner"></div>
                    <p>Fetching weather data...</p>
                </div>
            `;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString();
        }

        function displayWeather(data) {
            const card = document.createElement('div');
            card.className = 'weather-card';

            const temperature = Math.round(data.temperature);
            const feelsLike = Math.round(data.feels_like);

            card.innerHTML = `
                <h2>📍 ${data.city}</h2>
                <div class="location">${data.country}</div>
                <div class="timestamp">Updated: ${data.timestamp}</div>
                
                <div class="temperature-large">${temperature}°C</div>
                <div class="weather-description">${data.weather_description}</div>
                <div style="color: #999; font-size: 0.95em;">Feels like ${feelsLike}°C</div>
                
                <div class="weather-info">
                    <div class="info-item">
                        <div class="label">💧 Humidity</div>
                        <div class="value">${data.humidity}%</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🔽 Pressure</div>
                        <div class="value">${data.pressure} hPa</div>
                    </div>
                    <div class="info-item">
                        <div class="label">💨 Wind Speed</div>
                        <div class="value">${data.wind_speed} m/s</div>
                    </div>
                    <div class="info-item">
                        <div class="label">☁️ Cloudiness</div>
                        <div class="value">${data.cloudiness}%</div>
                    </div>
                    <div class="info-item">
                        <div class="label">👁️ Visibility</div>
                        <div class="value">${(data.visibility / 1000).toFixed(1)} km</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🌅 Sunrise</div>
                        <div class="value">${data.sunrise}</div>
                    </div>
                    <div class="info-item">
                        <div class="label">🌇 Sunset</div>
                        <div class="value">${data.sunset}</div>
                    </div>
                    <div class="info-item">
                        <div class="label">⛅ Condition</div>
                        <div class="value">${data.weather}</div>
                    </div>
                </div>
            `;

            weatherContainer.appendChild(card);
        }

        function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            showLoading();

            fetch(`/api/weather/${city}`)
                .then(response => {
                    if (!response.ok) throw new Error('Weather not found');
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        showError(`Error: ${data.error}`);
                        weatherContainer.innerHTML = '';
                    } else {
                        weatherContainer.innerHTML = '';
                        displayWeather(data);
                    }
                })
                .catch(error => {
                    showError(`Failed to fetch weather: ${error.message}`);
                    weatherContainer.innerHTML = '';
                });
        }

        // Load default city on page load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('cityInput').value = 'London';
            searchWeather();
        });

        // Allow Enter key to search
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });
    </script>
</body>
</html>
